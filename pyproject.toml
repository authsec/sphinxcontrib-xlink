[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sphinxcontrib-xlink"
version = "1.3.2"
description = "DEPRECATED - renamed to 'doxtr-xlink'. Install doxtr-xlink instead."
readme = "README.md"
authors = [{name = "Jens Frey", email = "jens.frey@coffeecrew.org"}]
license = {file = "LICENSE"}
requires-python = ">=3.8"
dependencies = []
classifiers = [
    "Development Status :: 7 - Inactive",
    "Framework :: Sphinx :: Extension",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/doxtr/doxtr-xlink"
Documentation = "https://github.com/doxtr/doxtr-xlink#readme"
Repository = "https://github.com/doxtr/doxtr-xlink.git"
Issues = "https://github.com/doxtr/doxtr-xlink/issues"
Changelog = "https://github.com/doxtr/doxtr-xlink/releases"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sphinxcontrib*"]
